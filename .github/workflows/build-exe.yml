name: Build Windows executable

# Builds MLBC Retiree Updater.exe on a real Windows machine (GitHub-hosted
# runner), since PyInstaller can't cross-compile a Windows .exe from Mac
# or Linux. Runs automatically whenever gui_app.py or cull_retirees.py
# change on main, and can also be triggered manually from the Actions tab.
#
# The finished .exe is attached to the run as a downloadable artifact —
# no GitHub account or git knowledge needed to grab it, just the direct
# link from the Actions tab (Dan downloads it and sends it to the admin).

on:
  push:
    branches: [main]
    paths:
      - "gui_app.py"
      - "cull_retirees.py"
      - ".github/workflows/build-exe.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyinstaller

      - name: Build the .exe
        run: |
          pyinstaller --onefile --windowed --name "MLBC Retiree Updater" gui_app.py

      - name: Upload .exe as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MLBC-Retiree-Updater-windows
          path: dist/MLBC Retiree Updater.exe
          retention-days: 90
